name: CI/CD Pipeline

on:
  push:
    branches: [ gh, main ]
  pull_request:
    branches: [ gh, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and install proto-common
      run: |
        cd proto-common
        mvn clean install

    - name: Build inventory service
      run: |
        cd inventory-service
        mvn clean package

    - name: Build order service
      run: |
        cd order-service
        mvn clean package

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push inventory service image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: inventory-service/Dockerfile
        push: true
        tags: ${{ vars.DOCKER_HUB_USERNAME }}/inventory-service:latest

    - name: Build and push order service image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: order-service/Dockerfile
        push: true
        tags: ${{ vars.DOCKER_HUB_USERNAME }}/order-service:latest

    - name: Run order service using Docker Compose
      working-directory: order-service
      run: docker compose up -d
