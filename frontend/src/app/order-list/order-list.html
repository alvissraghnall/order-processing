<div class="order-list">
  <h2>Order List</h2>
  <table>
    <thead>
      <tr>
        <th>Customer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total Price</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{order.customerName}}</td>
        <td>{{order.productName}}</td>
        <td>{{order.quantity}}</td>
        <td>${{order.price | number:'1.2-2'}}</td>
        <td>{{order.status}}</td>
      </tr>
    </tbody>
  </table>
</div>
