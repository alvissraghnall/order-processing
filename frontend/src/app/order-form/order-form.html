<div class="order-form">
  <h2>Create New Order</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="customerName">Customer Name:</label>
      <input type="text" id="customerName" [(ngModel)]="order.customerName" name="customerName" required>
    </div>
    
    <div class="form-group">
      <label for="productId">Product:</label>
      <select id="productId" [(ngModel)]="order.productId" name="productId" required>
        <option value="" disabled selected>Select a product</option>
        <option *ngFor="let product of products" [value]="product.id">
          {{product.name}} - ${{product.price}}
        </option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" [(ngModel)]="order.quantity" name="quantity" min="1" required>
    </div>
    
    <button type="submit" class="submit-btn">Submit Order</button>
  </form>
</div>
